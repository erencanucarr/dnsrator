<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DNSRator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div id="error-box" class="error-box" hidden></div>

        <header class="topbar">
            <span class="brand"><span class="brand-mark">DNSRATOR</span><span class="cursor" aria-hidden="true">▊</span></span>
            <div class="topnav">
                <button id="fav-toggle" class="theme-btn" title="Add to favorites"><i class="fa-regular fa-star"></i></button>
                <button id="theme-toggle" class="theme-btn" title="Theme">☾</button>
            </div>
        </header>

        <main class="wrap">
            <div class="status-bar">
                <span class="domain-name" id="current-site">—</span>
                <span id="blacklist-indicator" class="badge">…</span>
                <button id="copy-site" class="mini-btn" title="Copy site"><i class="fa fa-copy"></i></button>
            </div>

            <div id="sip-card" class="sip-card" hidden>
                <div class="sip-row">
                    <span class="sip-label">server ip</span>
                    <span id="sip-ip" class="sip-ip">—</span>
                    <span id="sip-mnem" class="sip-mnem" hidden></span>
                    <button id="sip-copy" class="mini-btn" title="Copy server IP" hidden><i class="fa fa-copy"></i></button>
                </div>
                <div id="sip-hint" class="sip-hint"></div>
            </div>

            <div class="tabs main-tabs" role="tablist">
                <button class="tab active" data-tab="dns" role="tab">dns</button>
                <button class="tab" data-tab="ip" role="tab">ip-lookup</button>
            </div>

            <div class="records-container">
                <!-- DNS Records Section -->
                <div class="panel record-box active" id="dns-section">
                    <div class="tabs inner-tabs" role="tablist">
                        <button class="tab active" data-tab="a">A <span class="tab-count zero" id="a-count">0</span></button>
                        <button class="tab" data-tab="www">WWW <span class="tab-count zero" id="www-count">0</span></button>
                        <button class="tab" data-tab="ns">NS <span class="tab-count zero" id="ns-count">0</span></button>
                        <button class="tab" data-tab="mx">MX <span class="tab-count zero" id="mx-count">0</span></button>
                        <button class="tab" data-tab="txt">TXT <span class="tab-count zero" id="txt-count">0</span></button>
                        <button class="tab" data-tab="ptr">PTR <span class="tab-count zero" id="ptr-count">0</span></button>
                    </div>
                    <div class="dns-records">
                        <div class="record-box a active" id="a-records"><div class="record-content"></div></div>
                        <div class="record-box www" id="www-records"><div class="record-content"></div></div>
                        <div class="record-box ns" id="ns-records"><div class="record-content"></div></div>
                        <div class="record-box mx" id="mx-records"><div class="record-content"></div></div>
                        <div class="record-box txt" id="txt-records"><div class="record-content"></div></div>
                        <div class="record-box ptr" id="ptr-records"><div class="record-content"></div></div>
                    </div>
                </div>
                <!-- IP Lookup Section -->
                <div class="panel record-box" id="ip-section">
                    <div class="search cmd">
                        <span class="prompt" aria-hidden="true"><span class="dollar">$</span><span class="cmd-name">lookup</span></span>
                        <input id="ip-input" type="text" placeholder="8.8.8.8" autocomplete="off" spellcheck="false">
                        <button id="lookup-btn">Query</button>
                    </div>
                    <div id="ip-result" class="result"><div class="empty-line">$ awaiting query…</div></div>
                    <div class="recent">
                        <span class="recent-label">recent</span>
                        <div id="ip-history" class="recent-chips"></div>
                        <button id="ip-history-clear" class="recent-clear" type="button">clear</button>
                    </div>
                </div>
            </div>

            <div class="loader"><span class="spin"></span>querying…</div>

            <footer class="foot">
                <span class="foot-brand">D N S R A T O R</span>
                <button id="open-settings" class="link-btn">settings</button>
            </footer>
        </main>
    </div>
    <script src="popup.js"></script>
</body>
</html>
